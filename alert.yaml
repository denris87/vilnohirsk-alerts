      • вул. Зелена: 1-21, 23-25, 25А, 26-35; 
      • вул. Кобзаря: 3-34; 
      • вул. Криничанська: 1-15, 15А, 17, 17А, 18-24, 26-36 (парні); 
      • вул. Степова: 41, 41/1, 42, 43, 47, 49, 55, 57, 65-83 (непарні); 
      • вул. Хмельницького: 2-26, 28; 
      • вул. Шевченка: 3-33 (непарні); 
      • вул. Юрія Устенка: 25-31 (непарні), 32, 33, 33А, 33Б, 33В, 34, 35, 35А, 36, 37, 37А, 37В, 39, 39А, 40-44, 46-54 (парні), 58, 60, 64-72 (парні).
      **с. КРИНИЧКИ:**

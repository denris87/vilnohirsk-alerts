    text: |
      **У зв’язку з проведенням планових робіт на електромережах у Вільногірську тимчасово припинятиметься електропостачання за низкою адрес.**

      **01 вересня з 07:30 до 18:00**
      • вул. Будівельників: 3, 4, 4А, 4Б, 4В, 5-9, 11, 13, 15, 15/22; 
      • вул. Варена: 14, 28, 30, 30А, 32, 32А, 34, 36, 36А, 38, 40; 
      • вул. Гірників: 1-20; 
      • вул. Захисників України: 12, 12А, 14, 19, 20, 22; 
      • вул. Металург: 10, 13, 20, 21, 23, 27, 28, 55, 58, 289, 490; 
      • вул. Садова: 3, 3А, 3Б, 3В, 4-8, 10, 12, 14-17, 17А, 18, 19, 19А, 20-30 (парні), 30/21, 32, 34; 
      • вул. Степова: 1, 13, 15, 17, 21, 23, 29, 29/1, 31, 33, 33А, 33Б, 33В, 37, 39; 
      • вул. Центральна: 1, 2, 2А, 3-8, 8А, 9, 10, 10А, 11-16, 16/18, 17-20, 20А, 21, 22, 22А, 23, 24, 24А, 25-27, 29, 29А, 31, 31А, 33, 35; 
      • вул. Юрія Устенка: 11, 13-15, 20, 23, 25, 27, 28-30. 
      **с. КРИНИЧКИ**
      • вул. Криничанська: 1.

      **02 вересня з 07:30 до 18:00**
      • бульвар Миру: 10; 
      • вул. Молодіжна: 32А, 34А, 55; 
      • вул. Центральна: 45, 51, 51А, 51Б, 53, 55, 55А, 55Б, 55В, 57, 57А.

      **03 вересня з 08:00 до 17:30**
      • бульвар Миру: 9А; 
      • вул. Центральна: 65, 67, 67А, 69А, 71А, 73.
      
  - show: false
    title: "📢 КП «Енергоефект» інформує:"
    text: |
      Тимчасово не працює свердловина на вул. Садовій, 30/21!
      Через поломку обладнання водопостачання призупинено.
      **Орієнтовне відновлення: середа, 17 червня.**
      **КП «Енергоефект» перепрошує за незручності.**

  - show: false
    title: "📢 КП «Жилрсевіс» інформує:"
    text: |
      **Увага:** масштабне відключення води у Вільногірську!
      **Коли:** з 05:00 5 серпня до 6 серпня (після завершення робіт).
      **Де:** по всьому місту.
      **Причина:** ремонт колектора.
      **Обов'язково зробіть запас питної та технічної води!**

  - show: true
    title: "📢 КП «Жілкомсервіс» інформує:"
    text: |
      **КП «Жілкомсервіс» повідомляє про зміни у графіку збору та вивозу сміття**
      **З 13 липня (на 1 годину пізніше звичного часу):**
      • вул. Варена 7, 12
      • вул. Устенка 41, 43 
      • вул. Устенка 35А, 37
      • вул. Устенка 31, 30 
      • вул. Устенка 25, 23 
      • вул. Садова 30/21 
      • вул. Садова 7,5,3,8
      • вул. Степова 33, 31 
      • вул. Будівельників 8 
      • вул. Будівельників 11, 13 
      •  вул. Центральна 12, 10, 4, 5 
      • вул. Центральна 3, 5, 7 
      • вул. Горняків 7, 8, 2, 1, 14, 16 
      • вул. Варена 13/7 
      • вул. Варена 21А, 21/8 
      • вул. Молодіжна 16/1, 16А 
      **Зверніть увагу: можливі незначні відхилення у часі прибуття спецтранспорту (в межах кількох хвилин).**
      **Управляюча компанія звертається до містян із проханням не залишати сміття у дворах та в невстановлених місцях.**

